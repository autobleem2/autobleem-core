# autobleem-core CI: build the SDK (lib_ableem + ab_core + ab_classic) and run the unit tests in the shared
# autobleem-build image, exactly as a consumer repo will. This is what verifies the split builds standalone.
# Gated by the AB_CI_ENABLED repository variable.
name: build

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # clang-format (the image's, 22) on the files this push / PR changed against its base - new code is held to
      # .clang-format without reformatting the existing tree
      - name: Format check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then base=origin/develop; fi
          tools/format.sh --check --changed "$base"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      # a failing suite fails the build; the one case that needs the launcher's src/resources skips itself here
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
